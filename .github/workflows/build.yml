name: Build package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phonopy: ["2.36.0", "4.4.0"]
        extras: ["", "[vasp]"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tested dependency profile
        run: python -m pip install -e ".${{ matrix.extras }}" pytest "phonopy==${{ matrix.phonopy }}"
      - name: Run package regressions
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import re
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              leaked_examples = [name for name in names if name.startswith("examples/")]
              leaked_private = [name for name in names if re.search(r"\.(pt|pth|ckpt|onnx|safetensors)$", name, re.I)]
          assert not leaked_examples, leaked_examples
          assert not leaked_private, leaked_private

          sdists = glob.glob("dist/*.tar.gz")
          assert len(sdists) == 1, sdists
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              leaked_private = [name for name in names if re.search(r"\.(pt|pth|ckpt|onnx|safetensors)$", name, re.I)]
          assert not leaked_private, leaked_private
          print(f"verified {wheels[0]} and {sdists[0]}")
          PY

      - name: Verify independently installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/zstar-review"
          "$RUNNER_TEMP/zstar-review/bin/python" -m pip install dist/*.whl pytest pytest-subtests
          "$RUNNER_TEMP/zstar-review/bin/python" -I tools/release_acceptance.py smoke --output "$RUNNER_TEMP/zstar-smoke"
          "$RUNNER_TEMP/zstar-review/bin/python" -I tools/release_acceptance.py tests --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/zstar-tests"

      - name: Upload accepted build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zstar-distributions-${{ github.sha }}
          path: dist/*

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: zstar-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zstar-smoke/*
            ${{ runner.temp }}/zstar-tests/*
